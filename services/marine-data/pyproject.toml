[project]
name = "axopar-marine-data"
version = "0.1.0"
description = "Marine data ingestion, validation, and water polygon generation for Axopar 28 Range Planner"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "pyproj>=3.6.0",
    "rasterio>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
