[project]
name = "axopar-routing"
version = "0.1.0"
description = "Vector-first water polygon graph routing engine for Axopar 28 Range Planner"
requires-python = ">=3.11"
dependencies = [
    "shapely>=2.0.0",
    "numpy>=1.26.0",
    "pyproj>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
