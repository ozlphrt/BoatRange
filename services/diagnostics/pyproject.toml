[project]
name = "axopar-diagnostics"
version = "0.1.0"
description = "Deterministic diagnostic snapshots and independent verification helpers"
requires-python = ">=3.11"
dependencies = ["shapely>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
