services:
  - type: web
    name: boatrange-api
    runtime: python
    plan: free
    buildCommand: >-
      pip install -e packages/fuel-model
      -e services/routing
      -e services/marine-data
      -e services/isochrone
      -e services/diagnostics
      -e apps/api
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir apps/api
    healthCheckPath: /health
