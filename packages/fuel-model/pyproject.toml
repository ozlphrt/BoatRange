[project]
name = "axopar-fuel-model"
version = "0.1.0"
description = "Axopar 28 fuel model — PCHIP interpolation, L/nm derivation, reserve logic"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
